{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'usuarios/css/style.css' %}">
</head>

<body>

    <div class="geral">
        <div class="bemvindo">
            <h1 class="NomeDoApp">D&D<span class="sinc">Fitness</span></h1>
            <h1 class="h1">Seja Bem-vindo(a)!</h1>
            <h2>Acesse sua conta para continuar</h2>
        </div>

        <div class="login">

            <!-- 🔥 FORM SEM BACKEND -->
            <form>
                <input type="email" id="email" placeholder="Digite seu e-mail" required><br><br>
                <input type="password" id="senha" placeholder="Digite sua senha" required><br>
                <button type="submit" id="btnLogin">Entrar</button>
            </form>

            <br>
            <h3>Esqueceu a senha?</h3><br>

            <div class="registrar">
                <!-- 🔥 CAMINHO RELATIVO -->
                <h3>Não tem conta? <a href="../Registro/registro.html"><span>Criar conta</span></a></h3>
            </div>
        </div>
    </div>

</body>

<!-- 🔥 JS CORRETO -->
<script src="script.js"></script>

</html>
